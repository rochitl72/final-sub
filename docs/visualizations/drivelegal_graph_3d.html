// NODE POSITIONING
// ══════════════════════════════════════════════════════════
const nodeMap = {};
const positions = {};

// Layout radii
const R_HUB     = 0;
const R_VGROUP  = 90;    // violation groups inner ring
const R_VIO     = 175;   // violations mid sphere
const R_STATE   = 270;   // states outer sphere
const R_CITY    = 330;   // cities outermost
const R_ROAD    = 120;   // road types side cluster
const R_VEH     = 120;   // vehicles side cluster

function spherePoint(index, total, radius, tiltX=0, tiltY=0, tiltZ=0) {
  // Fibonacci sphere distribution
  const golden = Math.PI * (3 - Math.sqrt(5));
  const y = 1 - (index / (total-1||1)) * 2;
  const r = Math.sqrt(Math.max(0, 1-y*y));
  const theta = golden * index;
  return new THREE.Vector3(
    Math.cos(theta)*r*radius,
    y*radius,
    Math.sin(theta)*r*radius
  );
}

function ringPoint(index, total, radius, yOffset=0, yScale=0.4) {
  const angle = (index/total)*Math.PI*2;
  const wobble = (Math.random()-0.5)*radius*yScale;
  return new THREE.Vector3(
    Math.cos(angle)*radius,
    yOffset + wobble,
    Math.sin(angle)*radius
  );
}

// Build node lookup
GRAPH_DATA.nodes.forEach(n => nodeMap[n.id] = n);

// Assign positions
const vioGroups = GRAPH_DATA.nodes.filter(n=>n.type==='vio_group');
const viols     = GRAPH_DATA.nodes.filter(n=>n.type==='violation');
const states    = GRAPH_DATA.nodes.filter(n=>n.type==='state');
const cities    = GRAPH_DATA.nodes.filter(n=>n.type==='city');
const roads     = GRAPH_DATA.nodes.filter(n=>n.type==='road');
const vehs      = GRAPH_DATA.nodes.filter(n=>n.type==='vehicle');

// Hub
positions['hub'] = new THREE.Vector3(0,0,0);

// Violation groups — inner sphere, evenly spaced
vioGroups.forEach((n,i) => {
  positions[n.id] = spherePoint(i, vioGroups.length, R_VGROUP);
});

// Violations — mid sphere, but pulled toward their group
viols.forEach((n,i) => {
  const groupId = 'grp:' + n.group;
  const gp = positions[groupId];
  const sp = spherePoint(i, viols.length, R_VIO);
  // blend toward group direction
  if(gp) {
    const dir = gp.clone().normalize();
    const rnd = (Math.random()-0.5)*40;
    positions[n.id] = dir.clone().multiplyScalar(R_VIO + rnd).add(
      new THREE.Vector3((Math.random()-0.5)*30,(Math.random()-0.5)*30,(Math.random()-0.5)*30)
    );
  } else {
    positions[n.id] = sp;
  }
});

// States — outer sphere
states.forEach((n,i) => {
  positions[n.id] = spherePoint(i, states.length, R_STATE);
});

// Cities — near their state
cities.forEach((n,i) => {
  const stateId = 'state:' + n.state;
  const sp = positions[stateId];
  if(sp) {
    const offset = new THREE.Vector3(
      (Math.random()-0.5)*45,
      (Math.random()-0.5)*45,
      (Math.random()-0.5)*45
    );
    positions[n.id] = sp.clone().normalize().multiplyScalar(R_CITY).add(offset);
  } else {
    positions[n.id] = spherePoint(i, cities.length, R_CITY);
  }
});

// Roads — left cluster
roads.forEach((n,i) => {
  const angle = (i/roads.length)*Math.PI*2;
  positions[n.id] = new THREE.Vector3(
    -R_ROAD*1.6 + Math.cos(angle)*40,
    Math.sin(angle)*40,
    (Math.random()-0.5)*50
  );
});

// Vehicles — right cluster
vehs.forEach((n,i) => {
  const angle = (i/vehs.length)*Math.PI*2;
  positions[n.id] = new THREE.Vector3(
    R_VEH*1.6 + Math.cos(angle)*45,
    Math.sin(angle)*45,
    (Math.random()-0.5)*50
  );
});

function glowMaterial(color, emissiveStrength=0.6, opacity=1) {
  return new THREE.MeshPhongMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: emissiveStrength,
    transparent: opacity < 1,
    opacity: opacity,
    shininess: 80,
  });
}

GRAPH_DATA.nodes.forEach(n => {
  const pos = positions[n.id];
  if(!pos) return;

  const color = hexToColor(n.color || TYPE_COLOR[n.type] || '#94a3b8');
  let geo, mat;

  if(n.type === 'hub') {
    geo = geos.hub;
    mat = new THREE.MeshPhongMaterial({
      color: 0xffffff, emissive: 0x3b82f6, emissiveIntensity: 0.8,
      transparent:true, opacity:0.9, shininess:120,
    });
  } else if(n.type === 'violation') {
    const r = Math.max(3, Math.min(8, n.size||5));
    geo = new THREE.SphereGeometry(r, 14, 14);
    mat = glowMaterial(color, 0.5);
  } else if(n.type === 'vio_group') {
    geo = geos.vio_group;
    mat = new THREE.MeshPhongMaterial({
      color, emissive:color, emissiveIntensity:0.7,
      wireframe:false, transparent:true, opacity:0.85, shininess:60,
    });
  } else if(n.type === 'state') {
    geo = geos.state;
    mat = glowMaterial(color, 0.5, 0.9);
  } else if(n.type === 'city') {
    geo = geos.city;
    mat = glowMaterial(color, 0.4, 0.85);
  } else if(n.type === 'road') {
    geo = geos.road;
    mat = glowMaterial(color, 0.5);
  } else if(n.type === 'vehicle') {
    geo = geos.vehicle;
    mat = glowMaterial(color, 0.5);
  } else {
    geo = new THREE.SphereGeometry(4,10,10);
    mat = glowMaterial(color, 0.4);
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData = { nodeId: n.id, nodeData: n };
  nodeGroup.add(mesh);
  meshes[n.id] = mesh;
});

// Hub glow halo
const haloGeo = new THREE.SphereGeometry(20, 32, 32);
const haloMat = new THREE.MeshPhongMaterial({
  color:0x3b82f6, emissive:0x3b82f6, emissiveIntensity:0.3,
  transparent:true, opacity:0.08, side:THREE.BackSide,
});
const halo = new THREE.Mesh(haloGeo, haloMat);
nodeGroup.add(halo);

// ══════════════════════════════════════════════════════════
// EDGES
// ══════════════════════════════════════════════════════════
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
let edgesVisible = true;

const EDGE_COLORS = {
  group_link: 0xf97316,
  vio_link:   0xef4444,
  state_link: 0x3b82f6,
  city_link:  0x7c3aed,
  road_link:  0xfbbf24,
  veh_link:   0x34d399,
  applies_on: 0x1e3a5f,
};
const EDGE_OPAC = {
  group_link:0.5, vio_link:0.2, state_link:0.4,
  city_link:0.15, road_link:0.4, veh_link:0.35, applies_on:0.06,
};

GRAPH_DATA.links.forEach(link => {
  const sp = positions[link.source];
  const ep = positions[link.target];
  if(!sp || !ep) return;

  const points = [sp.clone(), ep.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: EDGE_COLORS[link.type] || 0x334155,
    transparent: true,
    opacity: EDGE_OPAC[link.type] || 0.15,
  });
  const line = new THREE.Line(geo, mat);
  edgeGroup.add(line);
});

// ══════════════════════════════════════════════════════════
// LABELS (canvas sprites)
// ══════════════════════════════════════════════════════════
const labelGroup = new THREE.Group();
scene.add(labelGroup);
let labelsVisible = true;

function makeLabel(text, color='#e2e8f0', fontSize=13) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSize}px Inter,sans-serif`;
  const w = ctx.measureText(text).width + 16;
  canvas.width = Math.ceil(w * 2);
  canvas.height = Math.ceil((fontSize + 8) * 2);
  ctx.scale(2,2);
  ctx.font = `${fontSize}px Inter,sans-serif`;
  ctx.fillStyle = color;
  ctx.fillText(text, 8, fontSize);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.9,depthTest:false});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(canvas.width/14, canvas.height/14, 1);
  return sprite;
}

// Labels for important nodes only (hub, groups, states, roads, vehicles)
GRAPH_DATA.nodes.forEach(n => {
  if(!['hub','vio_group','state','road','vehicle'].includes(n.type)) return;
  const pos = positions[n.id];
  if(!pos) return;

  const offset = {hub:18,vio_group:13,state:10,road:12,vehicle:12}[n.type]||8;
  const fontSize = {hub:15,vio_group:11,state:10,road:10,vehicle:10}[n.type]||9;
  const color = {hub:'#ffffff',vio_group:'#fed7aa',state:'#93c5fd',road:'#fde68a',vehicle:'#6ee7b7'}[n.type]||'#cbd5e1';

  const label = makeLabel(n.label, color, fontSize);
  label.position.copy(pos);
  label.position.y += offset;
  label.userData = {nodeId:n.id};
  labelGroup.add(label);
});

// ══════════════════════════════════════════════════════════
// MOUSE INTERACTION
// ══════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;
let selectedMesh = null;
const tooltip = document.getElementById('tooltip');
const ttType = document.getElementById('tt-type');
const ttLabel = document.getElementById('tt-label');

document.addEventListener('mousemove', e => {
  mouse.x = (e.clientX/W)*2-1;
  mouse.y = -(e.clientY/H)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeGroup.children);

  if(hits.length) {
    const mesh = hits[0].object;
    if(mesh !== hoveredMesh) {
      if(hoveredMesh && hoveredMesh !== selectedMesh) {
        hoveredMesh.material.emissiveIntensity = hoveredMesh._origEI || 0.5;
        hoveredMesh.scale.setScalar(1);
      }
      hoveredMesh = mesh;
      if(mesh !== selectedMesh) {
        mesh._origEI = mesh.material.emissiveIntensity;
        mesh.material.emissiveIntensity = 1.5;
        mesh.scale.setScalar(1.3);
      }
    }
    const nd = mesh.userData.nodeData;
    if(nd) {
      ttType.textContent = nd.type?.replace('_',' ').toUpperCase() || '';
      ttLabel.textContent = nd.label || nd.id;
      tooltip.style.display='block';
      tooltip.style.left = (e.clientX+16)+'px';
      tooltip.style.top  = (e.clientY-10)+'px';
    }
    document.body.style.cursor='pointer';
  } else {
    if(hoveredMesh && hoveredMesh !== selectedMesh) {
      hoveredMesh.material.emissiveIntensity = hoveredMesh._origEI || 0.5;
      hoveredMesh.scale.setScalar(1);
    }
    hoveredMesh = null;
    tooltip.style.display='none';
    document.body.style.cursor='default';
  }
});

document.addEventListener('click', e => {
  if(e.target !== renderer.domElement) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeGroup.children);
  if(hits.length) {
    const mesh = hits[0].object;
    const nd = mesh.userData.nodeData;
    if(!nd || nd.id==='hub') return;
    if(selectedMesh) {
      selectedMesh.scale.setScalar(1);
      selectedMesh.material.emissiveIntensity = selectedMesh._origEI || 0.5;
    }
    selectedMesh = mesh;
    mesh.scale.setScalar(1.6);
    mesh.material.emissiveIntensity = 2.0;
    showInfoPanel(nd);
  }
});

function showInfoPanel(n) {
  const panel = document.getElementById('info-panel');
  const badge = document.getElementById('info-type');
  const nameEl = document.getElementById('info-name');
  const fieldsEl = document.getElementById('info-fields');
  const descEl = document.getElementById('info-desc');

  const typeColors = {
    violation:'#ef4444',vio_group:'#f97316',state:'#3b82f6',
    city:'#a78bfa',road:'#fbbf24',vehicle:'#34d399'
  };
  const tc = typeColors[n.type]||'#64748b';
  badge.textContent = n.type?.replace('_',' ').toUpperCase()||'NODE';
  badge.style.background = tc+'22';
  badge.style.color = tc;
  badge.style.border = `1px solid ${tc}44`;
  nameEl.textContent = n.label || n.id;

  const fields = [];
  if(n.mv_section)   fields.push(['MV Section', '§'+n.mv_section]);
  if(n.fine_count)   fields.push(['Fine Records', n.fine_count]);
  if(n.compoundable!==undefined) fields.push(['Compoundable', n.compoundable?'Yes':'No — court required']);
  if(n.count)        fields.push(['Violations', n.count]);
  if(n.rto)          fields.push(['RTO Prefix', n.rto]);
  if(n.capital)      fields.push(['Capital', n.capital]);
  if(n.multiplier&&n.multiplier!==1) fields.push(['Fine Multiplier', n.multiplier+'×']);
  if(n.segment)      fields.push(['Segment', n.segment?.replace('_',' ')]);
  if(n.fine_class)   fields.push(['Fine Class', n.fine_class]);
  if(n.bucket)       fields.push(['Road Bucket', n.bucket]);
  if(n.state)        fields.push(['State', n.state]);

  fieldsEl.innerHTML = fields.map(([k,v])=>
    `<div class="field"><span class="key">${k}</span><span class="val">${v}</span></div>`
  ).join('');

  descEl.textContent = n.description || '';
  descEl.style.display = n.description ? 'block':'none';

  panel.classList.add('visible');
}

document.getElementById('close-info').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('visible');
  if(selectedMesh) {
    selectedMesh.scale.setScalar(1);
    selectedMesh.material.emissiveIntensity = selectedMesh._origEI || 0.5;
    selectedMesh = null;
  }
});

// ══════════════════════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════════════════════
const searchInput = document.getElementById('search-input');
let searchHighlighted = [];

searchInput.addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  searchHighlighted.forEach(id => {
    const m = meshes[id];
    if(m && m !== selectedMesh) {
      m.scale.setScalar(1);
      m.material.emissiveIntensity = m._origEI || 0.5;
    }
  });
  searchHighlighted = [];
  if(!q) return;
  GRAPH_DATA.nodes.forEach(n => {
    if((n.label||'').toLowerCase().includes(q) || (n.id||'').toLowerCase().includes(q)) {
      const m = meshes[n.id];
      if(m) {
        m._origEI = m.material.emissiveIntensity;
        m.scale.setScalar(2.0);
        m.material.emissiveIntensity = 2.5;
        searchHighlighted.push(n.id);
      }
    }
  });
});

// ══════════════════════════════════════════════════════════
// ORBIT CONTROLS (manual implementation)
// ══════════════════════════════════════════════════════════
let autoRotate = true;
let isDragging = false;
let prevMouse = {x:0,y:0};
let spherical = {theta:0, phi:Math.PI/2.5, radius:480};
const MIN_R=150, MAX_R=900;

renderer.domElement.addEventListener('mousedown', e => {
  isDragging=true; prevMouse={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('mouseup', ()=>isDragging=false);
renderer.domElement.addEventListener('mouseleave', ()=>isDragging=false);

renderer.domElement.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx=e.clientX-prevMouse.x, dy=e.clientY-prevMouse.y;
  spherical.theta -= dx*0.005;
  spherical.phi   = Math.max(0.2, Math.min(Math.PI-0.2, spherical.phi + dy*0.005));
  prevMouse={x:e.clientX,y:e.clientY};
});

renderer.domElement.addEventListener('wheel', e => {
  spherical.radius = Math.max(MIN_R, Math.min(MAX_R, spherical.radius+e.deltaY*0.5));
},{passive:true});

// Touch support
renderer.domElement.addEventListener('touchstart', e => {
  isDragging=true;
  prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
renderer.domElement.addEventListener('touchend', ()=>isDragging=false);
renderer.domElement.addEventListener('touchmove', e => {
  if(!isDragging) return;
  const dx=e.touches[0].clientX-prevMouse.x, dy=e.touches[0].clientY-prevMouse.y;
  spherical.theta -= dx*0.005;
  spherical.phi   = Math.max(0.2,Math.min(Math.PI-0.2,spherical.phi+dy*0.005));
  prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

// Buttons
document.getElementById('btn-rotate').addEventListener('click', function(){
  autoRotate=!autoRotate;
  this.classList.toggle('active',autoRotate);
});
document.getElementById('btn-labels').addEventListener('click', function(){
  labelsVisible=!labelsVisible;
  labelGroup.visible=labelsVisible;
  this.classList.toggle('active',labelsVisible);
});
document.getElementById('btn-links').addEventListener('click', function(){
  edgesVisible=!edgesVisible;
  edgeGroup.visible=edgesVisible;
  this.classList.toggle('active',edgesVisible);
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  spherical={theta:0,phi:Math.PI/2.5,radius:480};
});

// ══════════════════════════════════════════════════════════
// ANIMATE
// ══════════════════════════════════════════════════════════
let t=0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;

  // Auto-rotate
  if(autoRotate && !isDragging) spherical.theta += 0.0015;

  // Camera orbit
  camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.radius * Math.cos(spherical.phi);
  camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0,0,0);

  // Hub pulse
  const hub = meshes['hub'];
  if(hub) {
    const s = 1 + Math.sin(t*2)*0.08;
    hub.scale.setScalar(s);
    hub.material.emissiveIntensity = 0.6 + Math.sin(t*2)*0.3;
    halo.scale.setScalar(s*1.4);
    halo.material.opacity = 0.05 + Math.sin(t)*0.04;
  }

  // Violation group gentle pulse
  vioGroups.forEach((n,i) => {
    const m = meshes[n.id];
    if(m && m!==selectedMesh && m!==hoveredMesh) {
      m.rotation.y = t*0.4 + i;
      m.rotation.x = t*0.2 + i*0.5;
    }
  });

  // Point light orbit
  pl1.position.x = Math.sin(t*0.4)*250;
  pl1.position.z = Math.cos(t*0.4)*250;

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', ()=>{
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});
</script>
